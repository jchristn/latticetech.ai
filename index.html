<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lattice AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            background: #000;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .backdrop {
            position: fixed;
            top: 50%;
            left: 50%;
            width: min(90vw, 90vh);
            width: min(90vw, 90dvh);
            aspect-ratio: 1 / 1;
            transform: translate(-50%, -50%);
            background: url('logo-large.png') center / contain no-repeat;
            opacity: 0.35;
            -webkit-mask-image: radial-gradient(circle at center, #000 0%, rgba(0,0,0,0.45) 25%, rgba(0,0,0,0.12) 42%, transparent 58%);
                    mask-image: radial-gradient(circle at center, #000 0%, rgba(0,0,0,0.45) 25%, rgba(0,0,0,0.12) 42%, transparent 58%);
            pointer-events: none;
        }

        .contact {
            position: relative;
            z-index: 1;
            display: inline-block;
            padding: 0.55rem 1.4rem;
            font-size: clamp(0.8rem, 1.75vw, 0.85rem);
            font-weight: 600;
            letter-spacing: 0.03em;
            color: #fff;
            background: #2563eb;
            border-radius: 999px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .contact:hover,
        .contact:focus-visible {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(37, 99, 235, 0.65);
        }

        .contact:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 4px;
        }
    </style>
</head>
<body>
    <div class="backdrop" aria-hidden="true"></div>
    <a class="contact" href="mailto:hello@latticetech.ai">Get in touch</a>
</body>
</html>
